name: Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/trasladar-maqueta-funcional]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version
      - run: node --check public/zona.js
      - run: node --check src/index.js
      - run: node --check src/modulos.js
      - run: node --check src/schema.js
      - run: node test/run.mjs
