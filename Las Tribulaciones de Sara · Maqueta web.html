<section class="hd"><div class="in"><img src="${LOGO}" alt="Escudo de Las Tribulaciones de Sara"><div class="ht"><div class="meta">Puente Genil · Desde 2007 · Estación de penitencia el Miércoles Santo</div><h1>Las Tribulaciones de Sara</h1><p class="lead">Primer grupo filial de nazarenos de María Santísima de la Victoria.</p><div class="ctas"><button class="btn" onclick="sc('historia')">Conócenos</button><button class="btn o" onclick="go('login')">Zona hermana</button></div></div><blockquote class="vq">«Por la fe, Sara misma recibió vigor para ser madre, siendo estéril y aún fuera de la edad apropiada, porque tuvo por fiel al que se lo había prometido.»<cite>Hebreos 11, 11</cite></blockquote></div></section>
<section class="sc1" id="historia"><div class="in"><div class="two"><div class="j"><div class="tag">Nuestra historia</div><h2>En mi recuerdo…</h2><p>Fundada tras la Estación de Penitencia de Nuestro Padre Jesús de las Penas Chiquito en 2007, tras la cual se fueron realizando pequeños encuentros entre las costaleras, quienes, motivadas por la invención de lo que hasta ahora aún no había existido, promulgaron destellos de ilusión en la idea. Citadas el día 15 de junio de 2007, fue el comienzo por parte de 15 hermanas asistentes, quienes, unificando algunas normas, eligiendo presidenta y estableciendo una cuota mínima, comenzaban su andadura.</p><p>Tras el suceso de tres años como I de las Penas se desatan los lazos entre el cuartel y la Hermandad. Tras nuestro Quinto Aniversario y coincidiendo con la Junta de mayo de 2012 y elección de presidenta, se deslucirán algunas ideas por parte de algunas hermanas de pertenecer de nuevo a una Hermandad. Fue entonces cuando se entabla relación con la Hermandad del Huerto. Oficialmente el grupo comienza a formar parte como Primer Grupo de María Stma. de la Victoria el día 21 de septiembre de 2012.</p></div><div><div class="phb tall">Foto de nuestros inicios</div><div class="tlw"><div class="tl">${S.tl.map(t=>`<div><b>${t[0]}</b><br>${t[1]}</div>`).join('')}</div><div class="phb">Otra foto</div></div></div></div></div></section>
<section class="dkb" id="hermandad"><div class="in"><div class="two r"><div><div class="phb tall dk2">Foto de la hermandad</div><div class="sw"><div><i style="background:#5a2a82"></i><b>Morado</b><span>túnica y cubrerrostro</span></div><div><i style="background:#8a1f3d"></i><b>Granate</b><span>bocamangas y cíngulo</span></div></div></div><div class="j"><div class="tag">Hermandad</div><h2>Morado y granate</h2><p>Las Tribulaciones de Sara pertenece a la Antigua y Fervorosa Cofradía de Nuestro Padre Jesús en la Oración del Huerto y María Stma. de la Victoria, manifestando el título de Primer Grupo Filial de Nazarenos de María Santísima de la Victoria. Todas las hermanas de la Corporación participan activamente en la Estación de Penitencia del Miércoles Santo, tanto de nazarenos como acólitos.</p><p>Esta Hermandad tuvo su primitivo asiento en la desaparecida iglesia de la Caridad y, al igual que la Cofradía del Señor del Lavatorio, también nació ligada al tronco de la Cofradía matriz de la Humildad y Paciencia cuando en sus orígenes se denominaba Cofradía de la Caridad, y salía de la ermita de este mismo nombre, arrancando sus orígenes posiblemente a finales del siglo XVII. Esta cofradía se reorganizó el 1 de enero de 1959, siendo su sede canónica la Iglesia de la Concepción, y poseyendo su casa de hermandad en c/ Luna, 42.</p><p>Nuestra Hermandad presenta como hábito túnica y cubrerrostro morado, con bocamangas y cíngulo granate. Los cargos de Junta de Gobierno visten capillo egipcio de color morado.</p></div></div></div></section>
<section class="sc2" id="cuaresma"><div class="in"><div class="tag">Tradición</div><h2>Nuestra Cuaresma</h2><div class="ph3"><div class="phb">Foto</div><div class="phb">Foto</div><div class="phb">Foto</div></div><div class="j cols2"><p>La antesala de la Semana Santa, en cualquier lugar cristiano, es la Cuaresma. En Puente Genil es vivida intensamente y de forma muy particular. La Cuaresma comienza el Miércoles de Ceniza y finaliza el Domingo de Ramos. La duración de cuarenta días simboliza, entre otras cosas, el retiro de Jesús en el desierto. Se inicia así un período marcado por las celebraciones religiosas, llamadas en función de su duración Triduos o Quinarios, que en honor a sus imágenes titulares organizan las Cofradías y Hermandades.</p><p>La Cuaresma está representada por una curiosa estampa de la imaginería popular, auténtico calendario que es representado por la Vieja Cuaresmera. Ésta constituye una medida del tiempo singular, contándose las semanas no por días sino por sábados.</p><p>Pero el acontecimiento más singular de nuestra Cuaresma lo constituyen los Sábados de Romanos. Cada sábado de Cuaresma, y hasta el Domingo de Ramos, tiene lugar la «Subida a Jesús». Cada noche, al compás de los pasodobles de la banda de música del «Imperio Romano» y de la Corporación «Los Ataos», una muchedumbre de pontanos y forasteros acompañamos su recorrido desde el barrio bajo hasta la explanada del Calvario, donde se encuentra la ermita de Ntro. Padre Jesús Nazareno, patrón de nuestro pueblo.</p><p>A lo largo de la subida, cada una de las Corporaciones va ocupando un lugar o espacio determinado, dirigiéndose al Calvario de forma pausada entre la charla amistosa, la «uvita» compartida y el cántico de las cuarteleras, esa saeta llana, dialogada, que llega al corazón de quien la escucha y sirve de oración para el pontano.</p><p>De vuelta al Cuartel, la presidenta en nuestro caso otorgará el honor de descolgar una pata de la vieja, en un ritual que adquiere diversas formas según cada cuartel, pero en todas constituye el momento culminante de los «Sábados de Romanos».</p><p>Por todo ello, es en la Cuaresma donde cabe entender el fervor de nuestro pueblo y la pasión por la Semana Santa. Y es también ahora cuando el visitante siente que hay algo inexplicable en todo esto. Asombro, contrariedad, admiración, rechazo; en cualquier caso, a nadie deja indiferente.</p><p>Os mostramos algunas singularidades de nuestros sábados de romanos, crónicas y fotografías que se han recogido año tras año desde nuestra fundación, así como las características que particularizan a nuestra Vieja Cuaresmera y el histórico de entrega de patas de nuestro cuartel.</p></div><div class="cta2"><div><b>Cánticos y cuarteleras</b><span>Descarga el cuadernillo en PDF</span></div><a class="btn" href="https://drive.google.com/file/d/1OQ2Cy81q82xu9Ka3oZ9vqudUaSQAw16s/view" target="_blank" rel="noopener">Descargar PDF</a></div></div></section>
<section class="sc1" id="hermanas"><div class="in"><div class="tag">Quiénes somos</div><h2>Nuestras hermanas</h2><div class="hg">${S.hm.filter(x=>x[2]!='Baja'&&x[7]).map(x=>`<div class="card" style="text-align:center;padding:22px 14px"><div class="av">${x[6]?`<img src="${x[6]}" alt="">`:x[0].split(' ').map(w=>w[0]).slice(0,2).join('')}</div><b>${x[0]}</b><br><span class="mu">${x[1]=='Administradora'?'Hermana':x[1]}</span><br><small class="mu">En el cuartel desde ${x[5]||'—'}</small></div>`).join('')}</div></div></section>
<section class="sc2" id="noticias"><div class="in"><div class="tag">Cuaresma 2026</div><h2>Noticias</h2><div class="ng">${S.news.map(n=>`<div class="card news"><div class="ph" style="position:relative;overflow:hidden">${n[2]?`<img src="${n[2]}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:'Foto del sábado'}</div><div class="t"><h3>${n[0]}</h3><p class="mu" style="margin:0">${n[1]}</p></div></div>`).join('')}</div></div></section>

function swapT(i){if(!S.swv)return alert('Elige quién te sustituye');S.turnos[i]=S.turnos[i].map(n=>n==S.me?S.swv:n);S.tlog.push({e:i,t:S.me.split(' ')[0]+' cedió su turno a '+S.swv.split(' ')[0]});S.sw=-1;draw()}
function chT(i,j,v){if(S.turnos[i].includes(v)&&S.turnos[i][j]!=v){alert('Esa hermana ya está en este turno');return draw()}S.turnos[i][j]=v;draw()}
function tkModal(){const m=S.tm,ch=(arr,k,cur)=>arr.map(x=>`<button class="chip ${cur==x[0]?'on':''}" onclick="S.tm.${k}='${x[0]}';draw()">${x[1]}</button>`).join('');return `<div class="ov" onclick="if(event.target==this){S.tmo=0;draw()}"><div class="sheet"><h3>Añadir ticket</h3><p class="mu" style="margin:0">${S.ev[m.e].n}. Tesorería lo revisará y lo incluirá en la contabilidad.</p><label>Comercio o concepto</label><input class="t" placeholder="Ej.: Mercadona" value="${m.c}" oninput="S.tm.c=this.value"><label>Importe</label><input class="amtin" type="number" step="0.01" placeholder="0,00 €" value="${m.i}" oninput="S.tm.i=this.value"><label>Foto del ticket</label><input type="file" accept="image/*" capture="environment" onchange="tkFile(this)">${m.img?`<img src="${m.img}" style="display:block;max-width:100%;max-height:170px;border-radius:10px;margin-top:10px">`:''}<label>¿Cómo se ha pagado?</label><div class="wr">${ch([['tarjeta','Con la tarjeta del grupo'],['caja','Con dinero de la caja'],['yo','Lo he adelantado yo']],'p',m.p)}</div><p style="margin:18px 0 0"><button class="btn" style="width:100%" onclick="tkSave()">Enviar a tesorería</button></p></div></div>`}
function tkSave(){const m=S.tm;if(!m.c||!(+m.i>0))return alert('Indica el comercio y el importe');S.tk.push({id:Date.now(),e:m.e,by:S.me,shop:m.c,i:+m.i,f:m.f,s:'P',p:m.p,d:'2026-11-08',img:m.img});S.tmo=0;draw()}
function tkFile(inp){const f=inp.files[0];if(!f)return;S.tm.f=f.name;const r=new FileReader();r.onload=()=>{S.tm.img=r.result;draw()};r.readAsDataURL(f)}
function mockTicket(t){const L=['Fecha: '+fd(t.d),'','Pan y bollería ...... '+(t.i*.12).toFixed(2),'Carne y embutido .... '+(t.i*.45).toFixed(2),'Bebidas ............. '+(t.i*.28).toFixed(2),'Varios .............. '+(t.i*.15).toFixed(2),'','TOTAL: '+t.i.toFixed(2)+' EUR','','Ticket de ejemplo'];const sv='<svg xmlns="http://www.w3.org/2000/svg" width="300" height="'+(120+L.length*20)+'"><rect width="300" height="100%" fill="#fff" stroke="#ddd"/><text x="150" y="40" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold">'+t.shop.toUpperCase()+'</text>'+L.map((l,i)=>'<text x="20" y="'+(80+i*20)+'" font-family="monospace" font-size="12">'+l+'</text>').join('')+'</svg>';return 'data:image/svg+xml;utf8,'+encodeURIComponent(sv)}
function tkView(){const t=S.tk.find(x=>x.id==S.tv);if(!t)return '';return `<div class="ov" onclick="if(event.target==this){S.tv=0;draw()}"><div class="sheet" style="text-align:center"><h3>${t.shop} · ${eur(t.i)}</h3><img src="${t.img||mockTicket(t)}" alt="Ticket" style="max-width:100%;max-height:60vh;border-radius:12px;border:1px solid var(--ln)"><p class="mu">${t.by} · ${fd(t.d)}</p><button class="btn" onclick="S.tv=0;draw()">Cerrar</button></div></div>`}
function tkDel(id){S.tk=S.tk.filter(t=>t.id!=id);draw()}
function tkSet(id,k,v){const t=S.tk.find(x=>x.id==id);t[k]=k=='i'?+v:v;draw()}
function tkInc(id){const t=S.tk.find(x=>x.id==id),e=S.ev[t.e],c=t.c||'Comida y bebida',cn=e.n+' · '+t.shop;
if(t.p=='yo'){let comp=0;if(t.r=='compensar'){const p=S.pend.find(x=>x[0]==t.by),n=Math.min(p?p[1]:0,Math.floor(t.i/S.cuota));if(n>0){comp=n*S.cuota;p[6].splice(0,n);p[1]=p[6].length;S.mov.push([t.d,'Gasto',c,cn+' (compensado con cuotas)','Compensación',comp,'V',t.by],[t.d,'Ingreso','Cuotas mensuales','Compensación ticket · '+t.shop,'Compensación',comp,'V',t.by,'Compensación'])}}
if(+(t.i-comp).toFixed(2)>0)S.mov.push([t.d,'Gasto',c,cn+(comp?' (resto devuelto en efectivo)':' (devuelto en efectivo)'),'Caja fuerte',+(t.i-comp).toFixed(2),'V',t.by])}
else S.mov.push([t.d,'Gasto',c,cn,tkA(t),+t.i,'V',t.by]);
t.s='I';draw()}
function tkRej(id){S.tk.find(x=>x.id==id).s='R';draw()}
function rd(inp,cb){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function hfoto(i,inp){rd(inp,u=>{S.hm[i][6]=u;draw()})}
function nfoto(inp){rd(inp,u=>{S.nf.img=u;S.nf.f=1;draw()})}
function estCard(){return `<div class="card"><h3>Estatutos</h3><p class="mu">Sube el PDF de los estatutos vigentes. Lo verán todas las hermanas.</p><input type="file" accept="application/pdf"><p class="mu">Archivo actual: Estatutos_vigentes.pdf</p></div>`}
function exportPDF(){try{window.print()}catch(e){alert('Usa Imprimir y elige Guardar como PDF')}}
function jcard(){const j=S.junta;if(!j)return '';const o=j.o.split('\n').filter(x=>x.trim());
return `<div class="card" style="border:2px solid var(--go);margin-bottom:16px"><div class="tag">Convocatoria de junta</div><h3>${fd(j.d)} · ${j.h} h</h3><p class="mu" style="margin:0 0 10px">${j.l}</p><b>Orden del día</b><ol style="margin:6px 0 14px;padding-left:20px">${o.map(x=>`<li>${x}</li>`).join('')}</ol><div class="seg" style="margin:0"><button class="${S.jr==1?'y':''}" onclick="S.jr=1;draw()">Asistiré</button><button class="${S.jr===0?'n':''}" onclick="S.jr=0;draw()">No podré</button></div><p class="mu" style="margin:10px 0 0">${j.si+(S.jr==1?1:0)} confirmadas · ${j.no+(S.jr===0?1:0)} no asistirán</p></div>`}
function convCard(){const f=S.jf;return `<div class="card"><h3>Convocar junta</h3><p class="mu">Se envía por correo a las hermanas y aparece en su sección de Actas.</p><div class="row"><div style="flex:1 1 150px"><label class="fl">Fecha</label><input class="t" type="date" value="${f.d}" oninput="S.jf.d=this.value"></div><div style="flex:1 1 110px"><label class="fl">Hora</label><input class="t" type="time" value="${f.h}" oninput="S.jf.h=this.value"></div><div style="flex:2 1 180px"><label class="fl">Lugar</label><input class="t" value="${f.l}" oninput="S.jf.l=this.value"></div></div><label class="fl">Orden del día (un punto por línea)</label><textarea class="t" rows="5" placeholder="Lectura del acta anterior&#10;Balance de tesorería&#10;Ruegos y preguntas" oninput="S.jf.o=this.value">${f.o}</textarea><p style="margin:16px 0 0"><button class="btn" onclick="conv()">Convocar junta</button>${S.junta?' <button class="chip" onclick="S.junta=null;draw()">Anular la convocatoria actual</button> <a class="chip" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="'+waLink('Junta el '+fd(S.junta.d)+' a las '+S.junta.h+' en '+S.junta.l+'. Orden del día: '+S.junta.o.split('\n').filter(Boolean).map((x,i)=>(i+1)+'. '+x).join(' · '))+'">Compartir por WhatsApp</a>':''}</p>${S.junta?`<p class="mu">Convocatoria activa: ${fd(S.junta.d)} · ${S.junta.h} h · ${S.junta.si+(S.jr==1?1:0)} confirmadas.</p>`:''}</div>`}
function conv(){const f=S.jf;if(!f.d||!f.o.trim())return alert('Indica la fecha y el orden del día');S.junta={d:f.d,h:f.h,l:f.l,o:f.o,si:0,no:0};S.jr=null;alert('Junta convocada. Las hermanas recibirán un correo y la verán en Actas.');draw()}
function extraCard(){return `<div class="card"><h3>Cuotas extraordinarias de este año</h3><p class="mu">Cambian cada año: créalas, edítalas o bórralas.</p>${S.extras.map((e,i)=>`<div class="row" style="margin-bottom:10px;align-items:center"><input class="t" style="flex:1 1 170px" value="${e[0]}" oninput="S.extras[${i}][0]=this.value"><input class="t" style="width:90px" type="number" value="${e[1]}" oninput="S.extras[${i}][1]=+this.value"><select class="t" style="width:210px" onchange="S.extras[${i}][2]=this.value;draw()">${[['una vez','Una sola vez'],['sábado','Cada sábado que asista']].map(o=>`<option value="${o[0]}" ${e[2]==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><button class="chip" onclick="S.extras.splice(${i},1);draw()">✕</button></div>`).join('')}<button class="chip" onclick="S.extras.push(['Nueva cuota',0,'una vez']);draw()">Añadir cuota extraordinaria</button></div>`}
function modal(){const m=S.m,ch=(arr,k,cur)=>arr.map(x=>`<button class="chip ${cur==x?'on':''}" onclick="S.m.${k}='${x}';${k=='t'?"S.m.c='';":''}draw()">${x}</button>`).join('');
return `<div class="ov" onclick="if(event.target==this){S.modal=0;draw()}"><div class="sheet"><h3>Nuevo apunte</h3><div class="wr">${ch(['Ingreso','Gasto','Traspaso'],'t',m.t)}</div>
<label>Importe</label><input class="amtin" type="number" step="0.01" placeholder="0,00 €" value="${m.i}" oninput="S.m.i=this.value">
${m.t!='Traspaso'?`<label>Categoría</label><div class="wr">${ch(S.cats[m.t],'c',m.c)}</div>`:''}
<label>${m.t=='Traspaso'?'Sale de':'Cuenta'}</label><div class="wr">${ch(['Banco','Caja fuerte'],'a',m.a)}</div>
<label>Concepto</label><input class="t" placeholder="Ej.: Recibo de la luz" value="${m.n}" oninput="S.m.n=this.value">
<p style="margin:18px 0 0"><button class="btn" style="width:100%" onclick="save()">Guardar apunte</button></p></div></div>`}
function save(){const m=S.m;if(!(+m.i>0)||(m.t!='Traspaso'&&!m.c))return alert('Indica importe y categoría');S.mov.push(['2026-03-11',m.t,m.c,m.n||m.c||'Traspaso',m.a,+m.i]);S.m={t:'Gasto',c:'',a:'Banco',i:'',n:''};S.modal=0;draw()}
function draw(){nav();const a=document.getElementById('app');a.className=S.v=='home'?'pw':'';a.innerHTML=V[S.v]()}
draw();
</script></body></html>
